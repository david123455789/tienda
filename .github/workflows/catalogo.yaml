name: Actualizar catálogo

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/actualizar-catalogo.js
      - name: Guardar cambios
        run: |
          if [ -n "$(git status --porcelain catalogo-snapshot.json)" ]; then
            git config user.name "catalogo-bot"
            git config user.email "catalogo-bot@users.noreply.github.com"
            git add catalogo-snapshot.json
            git commit -m "Actualizar catálogo"
            git push
          fi